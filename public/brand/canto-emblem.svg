<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Canto emblem">
  <title>Canto</title>
  <desc>Trois croches ligaturées : encre noire, liseré or continu, entre-deux des barres transparent.</desc>
  <defs>
    <linearGradient id="cn-gold" x1="180" y1="180" x2="880" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF3C4"/>
      <stop offset=".24" stop-color="#F6CE6B"/>
      <stop offset=".54" stop-color="#E4AB39"/>
      <stop offset=".8" stop-color="#BE8A23"/>
      <stop offset="1" stop-color="#8C6311"/>
    </linearGradient>
    <linearGradient id="cn-ink" x1="300" y1="180" x2="720" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#242932"/>
      <stop offset=".35" stop-color="#12161C"/>
      <stop offset=".7" stop-color="#05070A"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="cn-glint" x1="360" y1="0" x2="850" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF8E6" stop-opacity="0"/>
      <stop offset=".14" stop-color="#FFF8E6" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#F4CE74" stop-opacity=".45"/>
      <stop offset="1" stop-color="#D9A138" stop-opacity="0"/>
    </linearGradient>
    <!-- reflet de tete : s'eteint aux deux bouts, dans le repere de chaque tete -->
    <linearGradient id="cn-rim" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF3D2" stop-opacity="0"/>
      <stop offset=".38" stop-color="#FFF3D2" stop-opacity=".8"/>
      <stop offset="1" stop-color="#FFE0A0" stop-opacity="0"/>
    </linearGradient>

    <!-- silhouette : les formes se recouvrent, l'union donne un liseré sans couture interne -->
    <g id="cn-glyph">
      <!-- hampes, remontees dans la barre et noyees dans les tetes -->
      <path d="M370 400 C364 484 352 570 340 640 L306 644 C322 570 336 484 336 400 Z"/>
      <path d="M578 380 C572 466 560 552 548 616 L514 618 C530 552 544 466 544 380 Z"/>
      <path d="M840 340 C836 428 816 510 782 586 L750 574 C782 506 806 426 806 340 Z"/>
      <!-- tetes calligraphiques, inclinees a -22 degres (coordonnees figees) -->
      <path d="M340.2 630 C349.2 652.3 329.6 694.7 287 711.9 C244.3 729.2 200.8 712.2 191.8 690 C182.8 667.7 202.4 625.3 245 608.1 C287.7 590.8 331.2 607.8 340.2 630 Z"/>
      <path d="M553.9 602.9 C562.7 624.5 543.7 665.6 502.3 682.4 C461 699.1 418.8 682.7 410.1 661.1 C401.3 639.5 420.3 598.4 461.7 581.6 C503 564.9 545.2 581.3 553.9 602.9 Z"/>
      <path d="M778.2 570 C787.2 592.3 767.6 634.7 725 651.9 C682.3 669.2 638.8 652.2 629.8 630 C620.8 607.7 640.4 565.3 683 548.1 C725.7 530.8 769.2 547.8 778.2 570 Z"/>
      <!-- barre double -->
      <path d="M340 318 C500 286 686 246 852 206 L848 268 C686 303 500 337 338 364 Z"/>
      <path d="M337 398 C500 375 686 345 845 314 L838 376 C686 401 500 427 336 444 Z"/>
    </g>
  </defs>

  <g transform="translate(-10 53)">
    <!-- passe 1 : silhouette engraissee = liseré or du seul contour exterieur -->
    <use href="#cn-glyph" fill="url(#cn-gold)" stroke="url(#cn-gold)" stroke-width="15" stroke-linejoin="round"/>
    <!-- passe 2 : encre, a l'aplomb exact des formes -->
    <use href="#cn-glyph" fill="url(#cn-ink)"/>

    <!-- reflets speculaires -->
    <g fill="none" stroke="url(#cn-glint)" stroke-linecap="round">
      <path d="M374 331 C500 305 682 268 828 232" stroke-width="7"/>
      <path d="M372 411 C500 391 682 361 822 332" stroke-width="5"/>
    </g>
    <g fill="none" stroke="url(#cn-rim)" stroke-width="8" stroke-linecap="round">
      <path d="M211.3 692.9 C209.6 669.9 223.9 636 254.7 616 C268.4 607.3 280.3 604.6 287.9 604.8"/>
      <path d="M429 663.9 C427.3 641.6 441.2 608.7 471 589.3 C484.3 580.8 495.9 578.3 503.2 578.4"/>
      <path d="M649.3 632.9 C647.6 609.9 661.9 576 692.7 556 C706.4 547.3 718.3 544.6 725.9 544.8"/>
    </g>
  </g>
</svg>
