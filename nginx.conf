# Static hosting for the Canto PWA.
#
# Two rules matter beyond the usual: the service worker and the app shell must stay
# revalidated, or an installed visitor never receives a new release; and the
# manifest needs its own MIME type, which is not in every nginx mime.types.

types {
  application/manifest+json webmanifest;
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Canto is a single screen; unknown paths belong to the app shell, which also
  # makes deep links work offline.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }

  # Hashed bundle output: safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Never cache the worker itself: it is the only thing that can pull a new version.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  location /brand/ {
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  # Release probe: carries the version baked at image build time, so a deployment
  # cannot be validated by the container it replaces.
  location = /health {
    access_log off;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    alias /usr/share/nginx/html/health.json;
  }

  # Source maps are debugging aids; they are not part of the published surface.
  location ~ \.map$ {
    return 404;
  }
}
